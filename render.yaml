services:
  - type: web
    name: hom-line
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    # One worker: the in-memory rate limiter is per-process (see DEPLOY.md).
    startCommand: "gunicorn homline_project.wsgi:application --workers 1 --threads 4 --timeout 90 --access-logfile -"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: NODE_VERSION
        value: 24.21.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "hom-line.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://hom-line.onrender.com"
      # Set these in the Render dashboard (never in Git):
      - key: DATABASE_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
